<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Пользователи</title>
  <style>
    body { font-family: sans-serif; background: #f4f4f4; padding: 2rem; }
    .card { background: white; border-radius: 12px; padding: 1rem 1.5rem;
            display: flex; align-items: center; gap: 1rem;
            margin-bottom: 1rem; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; }
    .no-photo { width: 60px; height: 60px; border-radius: 50%; background: #ccc;
                display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
    h2 { margin: 0 0 .25rem; }
    p  { margin: 0; color: #666; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>Пользователи бота</h1>

  {% for user in users %}
  <div class="card">
    {% if user.photo_url %}
      <img src="{{ user.photo_url }}" alt="avatar">
    {% else %}
      <div class="no-photo">👤</div>
    {% endif %}
    <div>
      <h2>{{ user.first_name }} {{ user.last_name or '' }}</h2>
      {% if user.username %}<p>@{{ user.username }}</p>{% endif %}
      <p>ID: {{ user.id }} · Зарегистрирован: {{ user.created_at }}</p>
    </div>
  </div>
  {% endfor %}
</body>
</html>
